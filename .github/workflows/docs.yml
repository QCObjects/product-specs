name: docs

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [development, main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdown-link-check docs/*.md README.md AGENTS.md
